# Production overlay for the proctored exam service.
# Required env: POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD, JWT_KEY (same as main platform),
# MINIO_PUBLIC_ENDPOINT, CORS_ORIGIN. Everything else has safe defaults.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  cache:
    ports: !reset []

  storage:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-examstorage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

  migrate:
    build:
      context: .
      dockerfile: src/ExamService.Api/Dockerfile.migrate
    environment:
      ConnectionStrings__Default: "Host=db;Database=${POSTGRES_DB:-examservice};Username=${POSTGRES_USER:-exam};Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure"

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Database=${POSTGRES_DB:-examservice};Username=${POSTGRES_USER:-exam};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: cache:6379
      Minio__Endpoint: storage:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-examstorage}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      Minio__Bucket: exam-recordings
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      Storage__Provider: ${STORAGE_PROVIDER:-minio}
      AWS__Region: ${AWS_REGION:-us-east-1}
      AWS__Bucket: ${AWS_BUCKET:-exam-recordings}
      AWS__AccessKey: ${AWS_ACCESS_KEY_ID:-}
      AWS__SecretKey: ${AWS_SECRET_ACCESS_KEY:-}
      Jwt__Key: ${JWT_KEY:?JWT_KEY must match the main platform}
      Jwt__Issuer: ${JWT_ISSUER:-coaching-platform}
      Jwt__Audience: ${JWT_AUDIENCE:-coaching-web}
      Cors__Origin: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      RateLimit__PerMinute: ${RATE_LIMIT_PER_MINUTE:-600}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      Notifications__Webhook: ${RESULT_WEBHOOK:-}
      AI__Endpoint: ${AI_ENDPOINT:-}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Model: ${AI_MODEL:-local-heuristic}
      AI__FaceEndpoint: ${AI_FACE_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_started

  web:
    ports: ["${WEB_PORT:-13010}:80"]
